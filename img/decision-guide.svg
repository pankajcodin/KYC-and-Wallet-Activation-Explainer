<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1080" viewBox="0 0 1080 1080" font-family="Be Vietnam Pro, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="1080" height="1080" fill="#0c1317"/>
<rect width="1080" height="190" fill="#1d3140"/>
<image href="img/dao-logo-on-dark.png" xlink:href="img/dao-logo-on-dark.png" x="60" y="40" width="150" height="105"/>
<text x="250" y="95" font-size="44" font-weight="700" fill="#f1f5f8">Do I need Redbelly KYC?</text>
<text x="250" y="140" font-size="24" fill="#c2ced6">Native mainnet activity needs it. Holding outside does not.</text>
<rect x="60" y="230" width="960" height="108" rx="8" fill="#141f26" stroke="#263641"/>
<text x="90" y="276" font-size="28" font-weight="600" fill="#f1f5f8">I use Redbelly mainnet</text>
<text x="90" y="312" font-size="21" fill="#8fa1ad">Send, swap, use apps</text>
<rect x="790" y="262" width="200" height="44" rx="4" fill="#EF5350"/>
<text x="890" y="292" font-size="22" font-weight="700" text-anchor="middle" fill="#ffffff">Needed</text>
<rect x="60" y="352" width="960" height="108" rx="8" fill="#141f26" stroke="#263641"/>
<text x="90" y="398" font-size="28" font-weight="600" fill="#f1f5f8">I run a node and stake</text>
<text x="90" y="434" font-size="21" fill="#8fa1ad">2 accounts need network access</text>
<rect x="790" y="384" width="200" height="44" rx="4" fill="#EF5350"/>
<text x="890" y="414" font-size="22" font-weight="700" text-anchor="middle" fill="#ffffff">Needed</text>
<rect x="60" y="474" width="960" height="108" rx="8" fill="#141f26" stroke="#263641"/>
<text x="90" y="520" font-size="28" font-weight="600" fill="#f1f5f8">I bridge RBNT onto mainnet</text>
<text x="90" y="556" font-size="21" fill="#8fa1ad">Verify first, then use the coins</text>
<rect x="790" y="506" width="200" height="44" rx="4" fill="#EF5350"/>
<text x="890" y="536" font-size="22" font-weight="700" text-anchor="middle" fill="#ffffff">Needed</text>
<rect x="60" y="596" width="960" height="108" rx="8" fill="#141f26" stroke="#263641"/>
<text x="90" y="642" font-size="28" font-weight="600" fill="#f1f5f8">I hold RBNT on an exchange</text>
<text x="90" y="678" font-size="21" fill="#8fa1ad">Not an account on Redbelly Network</text>
<rect x="790" y="628" width="200" height="44" rx="4" fill="none" stroke="#86EFAC" stroke-width="2"/>
<text x="890" y="658" font-size="22" font-weight="700" text-anchor="middle" fill="#86EFAC">Not needed</text>
<rect x="60" y="718" width="960" height="108" rx="8" fill="#141f26" stroke="#263641"/>
<text x="90" y="764" font-size="28" font-weight="600" fill="#f1f5f8">I hold wrapped RBNT on another chain</text>
<text x="90" y="800" font-size="21" fill="#8fa1ad">The token lives on that chain</text>
<rect x="790" y="750" width="200" height="44" rx="4" fill="none" stroke="#86EFAC" stroke-width="2"/>
<text x="890" y="780" font-size="22" font-weight="700" text-anchor="middle" fill="#86EFAC">Not needed</text>
<rect x="60" y="840" width="960" height="108" rx="8" fill="#141f26" stroke="#263641"/>
<text x="90" y="886" font-size="28" font-weight="600" fill="#f1f5f8">I am a holder who wants to stake</text>
<text x="90" y="922" font-size="21" fill="#8fa1ad">No official page states a rule</text>
<rect x="790" y="872" width="200" height="44" rx="4" fill="none" stroke="#FCD34D" stroke-width="2"/>
<text x="890" y="902" font-size="22" font-weight="700" text-anchor="middle" fill="#FCD34D">Unconfirmed</text>
<text x="60" y="1010" font-size="22" fill="#c2ced6">DAO: open to every region. Network: not offered in 18 listed jurisdictions.</text>
<text x="60" y="1048" font-size="20" fill="#8fa1ad" font-family="JetBrains Mono, monospace">Last verified: 23 October 2026</text>
